<!DOCTYPE html>
<html lang="zh-Hant">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World 網頁</title>
    <!-- 引入 Tailwind CSS 以便快速加入漂亮的樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center min-h-screen m-0">
    <div class="bg-white p-10 rounded-2xl shadow-xl text-center transform transition-all duration-500 ease-out hover:scale-110 hover:shadow-2xl hover:-translate-y-2 cursor-pointer">
        <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 mb-4 tracking-tight">
            Hello, World!
        </h1>
        <p class="text-lg text-gray-500 font-medium">
            這是一個簡單的 HTML 網頁起點。
